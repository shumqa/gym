<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="GYM LOG — дневник тренировок, история занятий, таймер и личные рекорды.">
  <title>GYM LOG — личный дневник тренировок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,0,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080808;
  --surface: #111111;
  --surface2: #1a1a1a;
  --surface3: #222222;
  --border: #2a2a2a;
  --accent: #c8ff00;
  --accent-dim: rgba(200,255,0,0.12);
  --accent-dim2: rgba(200,255,0,0.06);
  --text: #f0f0f0;
  --text2: #888;
  --text3: #555;
  --danger: #ff4d4d;
  --success: #c8ff00;
  --warn: #ffa040;
  --r: 12px;
  --r-sm: 8px;
  /* clock btn bg */
  --btn-gray-bg: #2c2c2e;
  --btn-gray-clr: #e0e0e0;
  --btn-green-bg: #1c3d00;
  --btn-run-bg: #3a1000;
  --btn-run-clr: #ff6b35;
  --hero-gradient: radial-gradient(circle, rgba(200,255,0,0.08) 0%, transparent 70%);
}

/* ===== LIGHT THEME ===== */
[data-theme="light"] {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface2: #f2f2f7;
  --surface3: #e5e5ea;
  --border: #d1d1d6;
  --accent: #4a7c00;
  --accent-dim: rgba(74,124,0,0.12);
  --accent-dim2: rgba(74,124,0,0.06);
  --text: #1c1c1e;
  --text2: #636366;
  --text3: #aeaeb2;
  --danger: #d0302a;
  --success: #4a7c00;
  --warn: #c27400;
  --btn-gray-bg: #e5e5ea;
  --btn-gray-clr: #1c1c1e;
  --btn-green-bg: #d4edaa;
  --btn-run-bg: #ffe0cc;
  --btn-run-clr: #c25000;
  --hero-gradient: radial-gradient(circle, rgba(74,124,0,0.07) 0%, transparent 70%);
}
[data-theme="light"] .topbar { background: var(--bg); border-bottom-color: var(--border); }
[data-theme="light"] .clk-ring-bg { stroke: var(--surface3); }
[data-theme="light"] .hist-icon.push  { background: rgba(147,92,231,0.12); }
[data-theme="light"] .hist-icon.pull  { background: rgba(56,189,148,0.12); }
[data-theme="light"] .hist-icon.legs  { background: rgba(255,107,107,0.12); }
[data-theme="light"] .hist-icon.cardio{ background: rgba(255,160,64,0.12); }
[data-theme="light"] .pill-push { background: rgba(147,92,231,0.10); }
[data-theme="light"] .pill-pull { background: rgba(56,189,148,0.10); }
[data-theme="light"] .pill-legs { background: rgba(255,107,107,0.10); }
[data-theme="light"] .pill-cardio{ background: rgba(255,160,64,0.10); }
[data-theme="light"] .muscle-tag.primary { background: rgba(74,124,0,0.12); color: var(--accent); }
[data-theme="light"] .vid-modal-overlay { background: rgba(0,0,0,0.6); }
[data-theme="light"] .vid-info-sheet { background: var(--surface); }

/* theme toggle button */
.theme-toggle {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text2); transition: all .2s;
  flex-shrink: 0;
}
.theme-toggle:active { transform: scale(.9); }
.theme-toggle svg { width: 18px; height: 18px; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  max-width: 430px;
  margin: 0 auto;
  padding-bottom: 80px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}


/* TYPOGRAPHY */
.display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.03em; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* TOP BAR */
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 16px 20px 14px;
  display: flex; align-items: flex-end; justify-content: space-between;
}
.topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--accent); letter-spacing: 0.06em; line-height: 1; }
.topbar-sub { font-size: 12px; color: var(--text2); font-weight: 400; letter-spacing: 0.03em; margin-bottom: 2px; }

/* BOTTOM NAV */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 200;
}
.nav-btn {
  flex: 1; padding: 10px 0 12px;
  background: none; border: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--text3); transition: color .2s;
  -webkit-tap-highlight-color: transparent;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
.nav-label { font-size: 10px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }

/* VIEWS */
.view { display: none; padding: 20px; }
.view.active { display: block; }
#view-timer { padding: 0; }
#view-timer.active { display: flex; flex-direction: column; min-height: calc(100vh - 60px); }


/* SECTION TITLES */
.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 13px; letter-spacing: 0.15em;
  color: var(--text3); text-transform: uppercase;
  margin-bottom: 12px; margin-top: 24px;
}
.section-title:first-child { margin-top: 0; }

/* DATE HERO */
.date-hero {
  background: var(--surface);
  border-radius: var(--r);
  border: 1px solid var(--border);
  padding: 20px;
  margin-bottom: 16px;
  position: relative; overflow: hidden;
}
.date-hero::before {
  content: '';
  position: absolute; top: -30px; right: -30px;
  width: 120px; height: 120px;
  background: var(--hero-gradient);
  pointer-events: none;
}
.date-line { font-size: 12px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
.date-big { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--text); letter-spacing: 0.02em; line-height: 1; }
.date-workout { font-size: 14px; color: var(--accent); font-weight: 500; margin-top: 8px; }
.date-workout-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* PROGRESS BAR */
.progress-wrap { margin-bottom: 16px; }
.progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress-label { font-size: 13px; color: var(--text2); font-weight: 400; }
.progress-count { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--accent); letter-spacing: 0.05em; }
.progress-bar-bg {
  height: 4px; background: var(--surface3); border-radius: 4px; overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: var(--accent); border-radius: 4px;
  transition: width .4s cubic-bezier(.4,0,.2,1);
}

/* EXERCISE CARD */
.ex-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color .2s;
}
.ex-card.done { border-color: rgba(200,255,0,0.25); }
.ex-card-main {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; cursor: pointer;
}
.ex-checkbox {
  width: 22px; height: 22px; flex-shrink: 0;
  border: 1.5px solid var(--text3); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.ex-card.done .ex-checkbox {
  background: var(--accent); border-color: var(--accent);
}
.ex-checkbox svg { width: 13px; height: 13px; stroke: #000; stroke-width: 2.5; opacity: 0; transition: opacity .15s; }
.ex-card.done .ex-checkbox svg { opacity: 1; }
.ex-info { flex: 1; min-width: 0; }
.ex-name {
  font-size: 14px; font-weight: 500; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color .2s;
}
.ex-card.done .ex-name { color: var(--text2); text-decoration: line-through; }
.ex-sets { font-size: 12px; color: var(--text2); margin-top: 2px; }
.ex-muscles { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.muscle-tag {
  font-size: 10px; padding: 2px 7px; border-radius: 20px;
  font-weight: 500; letter-spacing: 0.02em;
  background: var(--accent-dim2); color: var(--text3);
}
.muscle-tag.primary { background: var(--accent-dim); color: var(--accent); }
.ex-expand-btn {
  width: 28px; height: 28px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--text3); cursor: pointer;
  transition: transform .2s, color .2s;
}
.ex-expand-btn svg { width: 16px; height: 16px; }
.ex-expand-btn.open { transform: rotate(180deg); }
.ex-detail {
  padding: 0 16px 14px 52px; display: none;
  font-size: 12px; color: var(--text2); line-height: 1.6;
  border-top: 1px solid var(--border);
  padding-top: 10px;
}
.ex-detail.open { display: block; }

/* REST DAY CARD */
.rest-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 28px 24px; text-align: center;
}
.rest-icon { font-size: 40px; margin-bottom: 12px; }
.rest-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--text); letter-spacing: 0.05em; margin-bottom: 6px; }
.rest-text { font-size: 13px; color: var(--text2); line-height: 1.6; }

/* BUTTONS */
.btn {
  display: block; width: 100%;
  padding: 15px; border: none; border-radius: var(--r-sm);
  font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.12em;
  cursor: pointer; transition: all .15s; text-align: center;
}
.btn-accent { background: var(--accent); color: #000; }
.btn-accent:hover { opacity: .9; }
.btn-accent:active { transform: scale(.98); }
.btn-outline {
  background: transparent; color: var(--text);
  border: 1px solid var(--border);
}
.btn-outline:hover { border-color: var(--text3); }
.btn-outline:active { transform: scale(.98); }
.btn-danger { background: rgba(255,77,77,0.12); color: var(--danger); border: 1px solid rgba(255,77,77,0.2); }
.btn + .btn { margin-top: 8px; }
.btn-sm {
  font-size: 13px; padding: 8px 16px; width: auto; display: inline-block;
  font-family: 'DM Sans', sans-serif; font-weight: 500; letter-spacing: 0.03em;
  border: 1px solid var(--border); background: var(--surface2); color: var(--text2);
  border-radius: var(--r-sm); cursor: pointer; transition: all .15s;
}
.btn-sm:hover { border-color: var(--accent); color: var(--accent); }

/* WORKOUT TYPES - schedule */
.day-pill {
  display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 3px 8px; border-radius: 4px; margin-bottom: 8px;
}
.pill-push { background: rgba(147,92,231,0.15); color: #b794f4; }
.pill-pull { background: rgba(56,189,148,0.15); color: #4fd1c5; }
.pill-legs { background: rgba(255,107,107,0.15); color: #fc8181; }
.pill-cardio { background: rgba(255,160,64,0.15); color: #f6ad55; }

.schedule-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 12px; overflow: hidden;
}
.schedule-header {
  padding: 16px 18px;
  display: flex; align-items: center; justify-content: space-between;
  cursor: pointer;
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.schedule-header.open { border-bottom-color: var(--border); }
.schedule-day { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.05em; }
.schedule-type { font-size: 12px; color: var(--text2); margin-top: 1px; }
.schedule-chevron { color: var(--text3); transition: transform .2s; }
.schedule-chevron.open { transform: rotate(180deg); }
.schedule-body { display: none; padding: 14px 18px; }
.schedule-body.open { display: block; }
.sched-ex {
  display: flex; align-items: baseline; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.sched-ex:last-child { border-bottom: none; }
.sched-ex-name { flex: 1; color: var(--text); }
.sched-ex-sets { font-size: 11px; color: var(--accent); font-weight: 500; white-space: nowrap; }
.start-from-schedule { margin: 14px 0 0; }

/* HISTORY */
.hist-empty {
  text-align: center; padding: 48px 24px;
  color: var(--text3); font-size: 14px; line-height: 1.8;
}
.hist-empty-icon { font-size: 36px; margin-bottom: 12px; }
.hist-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 14px 16px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 14px;
}
.hist-icon {
  width: 42px; height: 42px; border-radius: var(--r-sm); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 0.05em;
}
.hist-icon.push { background: rgba(147,92,231,0.15); color: #b794f4; }
.hist-icon.pull { background: rgba(56,189,148,0.15); color: #4fd1c5; }
.hist-icon.legs { background: rgba(255,107,107,0.15); color: #fc8181; }
.hist-icon.cardio { background: rgba(255,160,64,0.15); color: #f6ad55; }
.hist-info { flex: 1; min-width: 0; }
.hist-name { font-size: 14px; font-weight: 500; color: var(--text); }
.hist-date { font-size: 12px; color: var(--text2); margin-top: 2px; }
.hist-right { text-align: right; }
.hist-pct {
  font-family: 'Bebas Neue', sans-serif; font-size: 22px;
  letter-spacing: 0.03em;
}
.hist-pct.full { color: var(--accent); }
.hist-pct.partial { color: var(--warn); }
.hist-exercises { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* STATS BAR */
.stats-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; margin-bottom: 16px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 12px 14px;
}
.stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--accent); letter-spacing: 0.03em; }
.stat-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

/* ACTIVE SESSION BANNER */
.active-banner {
  background: var(--accent-dim);
  border: 1px solid rgba(200,255,0,0.3);
  border-radius: var(--r-sm);
  padding: 12px 16px; margin-bottom: 16px;
  display: none; align-items: center; justify-content: space-between;
}
.active-banner.visible { display: flex; }
.active-banner-text { font-size: 13px; color: var(--accent); font-weight: 500; }
.active-banner-sub { font-size: 11px; color: rgba(200,255,0,0.7); margin-top: 2px; }
.timer { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--accent); letter-spacing: 0.1em; }

/* TOAST */
.toast {
  position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--surface3); border: 1px solid var(--border);
  padding: 10px 20px; border-radius: 999px;
  font-size: 13px; color: var(--text); font-weight: 500;
  opacity: 0; transition: all .3s; pointer-events: none;
  white-space: nowrap; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 500; display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-radius: var(--r) var(--r) 0 0;
  padding: 24px 20px 36px; width: 100%; max-width: 430px;
  max-height: 80vh; overflow-y: auto;
}
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 0.05em; margin-bottom: 16px; }
.modal-text { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 20px; }

/* CONFIRM FINISH */
.finish-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.finish-stat {
  background: var(--surface2); border-radius: var(--r-sm);
  padding: 12px; text-align: center;
}
.finish-stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--accent); }
.finish-stat-lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

/* ANIMATIONS */
@keyframes check-pop {
  0% { transform: scale(1); }
  50% { transform: scale(1.06); }
  100% { transform: scale(1); }
}
.ex-card.just-done { animation: check-pop .25s ease; }

/* CLEAR HISTORY */
.clear-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; padding: 10px;
  background: transparent; border: 1px dashed var(--border);
  color: var(--text3); font-size: 12px; font-family: 'DM Sans', sans-serif;
  border-radius: var(--r-sm); cursor: pointer; margin-top: 16px;
  transition: all .2s;
}
.clear-btn:hover { border-color: var(--danger); color: var(--danger); }

.weekday-tag {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
  padding: 2px 6px; border-radius: 4px; margin-right: 6px;
  background: var(--surface3); color: var(--text3);
}
.weekday-tag.today { background: var(--accent-dim); color: var(--accent); }

.no-workout-today {
  font-size: 12px; color: var(--text3);
  margin-top: 8px; line-height: 1.6;
}

.choose-title { font-size: 13px; color: var(--text2); margin-bottom: 10px; font-weight: 500; }
.choose-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choose-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--r-sm); padding: 14px 12px;
  cursor: pointer; transition: all .15s; text-align: center;
}
.choose-card:hover { border-color: var(--accent); }
.choose-card:active { transform: scale(.97); }
.choose-card-day { font-family: 'Bebas Neue', sans-serif; font-size: 16px; letter-spacing: 0.05em; margin-bottom: 3px; }
.choose-card-type { font-size: 11px; color: var(--text2); }

/* ============================
   TIMER / STOPWATCH VIEW
   ============================ */
/* Sub-tabs */
.clk-tabs {
  display: flex; border-bottom: 1px solid var(--border);
  padding: 0 20px; background: var(--bg); flex-shrink: 0;
}
.clk-tab {
  flex: 1; padding: 14px 0; background: none; border: none;
  font-size: 13px; font-weight: 500; color: var(--text3);
  cursor: pointer; position: relative; transition: color .2s;
  letter-spacing: 0.03em;
}
.clk-tab.active { color: var(--accent); }
.clk-tab.active::after {
  content: ''; position: absolute; bottom: -1px; left: 20%; right: 20%;
  height: 2px; background: var(--accent); border-radius: 2px;
}

/* Panel */
.clk-panel { display: none; flex-direction: column; flex: 1; padding: 0 24px 20px; }
.clk-panel.active { display: flex; }

/* Ring + display */
.clk-ring-wrap {
  position: relative; margin: 20px auto 28px;
  width: 260px; height: 260px; flex-shrink: 0;
}
.clk-ring-svg {
  position: absolute; inset: 0; transform: rotate(-90deg);
  width: 100%; height: 100%;
}
.clk-ring-bg { fill: none; stroke: var(--surface3); stroke-width: 5; }
.clk-ring-fg {
  fill: none; stroke: var(--accent); stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dashoffset .1s linear;
}
.clk-ring-fg.paused { stroke: var(--warn); }
.clk-ring-fg.alert  { stroke: var(--danger); }
.clk-display {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.clk-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 58px; letter-spacing: 0.04em;
  color: var(--text); line-height: 1; font-feature-settings: "tnum";
}
.clk-time-sub { font-size: 16px; color: var(--text2); margin-top: 4px; letter-spacing: 0.06em; }
.clk-lap-count { font-size: 12px; color: var(--text3); margin-top: 6px; letter-spacing: 0.05em; }

/* Circular buttons — iPhone style */
.clk-btns {
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 14px; margin-bottom: 28px; flex-shrink: 0;
}
.clk-btn {
  width: 78px; height: 78px; border-radius: 50%; border: none;
  font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: transform .12s, opacity .12s;
  display: flex; align-items: center; justify-content: center;
  position: relative; -webkit-tap-highlight-color: transparent;
}
.clk-btn:active { transform: scale(.93); opacity: .85; }
.clk-btn-gray  { background: var(--btn-gray-bg); color: var(--btn-gray-clr); }
.clk-btn-green { background: var(--btn-green-bg); color: var(--accent); border: 1.5px solid var(--accent-dim); }
.clk-btn-green.running { background: var(--btn-run-bg); color: var(--btn-run-clr); border-color: rgba(255,107,53,0.3); }
.clk-btn-green.paused  { background: var(--btn-green-bg); color: var(--accent); border-color: var(--accent-dim); }
.clk-btn span { font-size: 13px; font-weight: 600; }
/* Inner ring on buttons */
.clk-btn::before {
  content: ''; position: absolute; inset: 4px;
  border-radius: 50%; border: 1px solid rgba(255,255,255,0.06);
}

/* LAPS */
.clk-laps { flex: 1; overflow-y: auto; }
.clk-lap-header {
  display: flex; justify-content: space-between;
  padding: 6px 4px; border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase;
  font-weight: 500; margin-bottom: 4px;
}
.clk-lap-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 4px; border-bottom: 1px solid var(--border);
}
.clk-lap-row:last-child { border-bottom: none; }
.clk-lap-num { font-size: 14px; font-weight: 500; color: var(--text2); }
.clk-lap-time { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.05em; color: var(--text); }
.clk-lap-row.fastest .clk-lap-time { color: var(--accent); }
.clk-lap-row.slowest .clk-lap-time { color: var(--danger); }
.clk-lap-row.current .clk-lap-time { color: var(--text2); }

/* TIMER PICKER — iOS-style scroll wheel */
.tmr-picker-wrap {
  display: flex; align-items: center; justify-content: center;
  gap: 0; height: 220px; position: relative; overflow: hidden;
  margin: 28px 0;
}
/* gradient masks top/bottom */
.tmr-picker-wrap::before, .tmr-picker-wrap::after {
  content: ''; position: absolute; left: 0; right: 0; z-index: 2;
  height: 80px; pointer-events: none;
}
.tmr-picker-wrap::before { top: 0; background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%); }
.tmr-picker-wrap::after  { bottom: 0; background: linear-gradient(to top, var(--bg) 0%, transparent 100%); }
/* Center selection line */
.tmr-picker-highlight {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
  height: 44px; background: var(--surface2); border-radius: 10px;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  pointer-events: none; z-index: 1;
}
.tmr-col {
  flex: 1; overflow-y: scroll; scroll-snap-type: y mandatory;
  scrollbar-width: none; -ms-overflow-style: none;
  height: 220px; position: relative; z-index: 3;
}
.tmr-col::-webkit-scrollbar { display: none; }
.tmr-col-item {
  height: 44px; display: flex; align-items: center; justify-content: center;
  scroll-snap-align: center;
  font-family: 'Bebas Neue', sans-serif; font-size: 36px;
  letter-spacing: 0.04em; color: var(--text2);
  cursor: pointer; transition: color .1s;
}
/* padding top/bottom so first/last items can center */
.tmr-col::before, .tmr-col::after {
  content: ''; display: block; height: 88px;
}
.tmr-col-label {
  width: 32px; display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--text3); font-weight: 500; z-index: 3;
}

/* Timer countdown display */
.tmr-countdown-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.tmr-countdown {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 72px; letter-spacing: 0.04em; color: var(--text);
  line-height: 1; text-align: center;
}
.tmr-countdown.alerting { color: var(--danger); animation: tmr-pulse 1s infinite; }
@keyframes tmr-pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
.tmr-subtitle { font-size: 13px; color: var(--text3); margin-top: 8px; letter-spacing: 0.06em; }

/* Alert overlay */
.tmr-done-banner {
  display: none; background: var(--danger);
  color: #fff; text-align: center; padding: 12px;
  font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
  border-radius: var(--r-sm); margin-bottom: 12px;
  animation: tmr-pulse 0.8s infinite;
}
.tmr-done-banner.show { display: block; }


/* Profile and personal records */
.profile-heading { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px; }

.profile-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:stretch; }
.profile-panel { min-width:0; padding:22px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 14px 34px rgba(0,0,0,.08); }

.profile-input { display:block; width:100%; min-width:0; min-height:44px; padding:11px 12px; border:1px solid var(--border); border-radius:9px; outline:none; background:var(--surface2); color:var(--text); font:14px 'DM Sans',sans-serif; transition:border-color .18s, box-shadow .18s; }
.profile-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-dim2); }
.profile-input::placeholder { color:var(--text3); }
.profile-save { margin-top:17px; }
.profile-save-hint { margin-top:9px; color:var(--text3); font-size:10px; line-height:1.5; }
.bmi-result { display:flex; flex-direction:column; min-height:270px; }
.bmi-score-row { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.bmi-kicker { color:var(--text2); font-size:11px; }
.bmi-score { margin-top:1px; font:54px/.98 'Bebas Neue',sans-serif; letter-spacing:.02em; }
.bmi-status { display:inline-flex; max-width:170px; padding:7px 10px; border-radius:999px; background:var(--surface2); font-size:10px; font-weight:700; text-align:center; }
.bmi-status.positive { color:var(--accent); background:var(--accent-dim); }
.bmi-status.warning { color:var(--warn); background:rgba(255,160,64,.12); }
.bmi-status.info { color:#60a5fa; background:rgba(96,165,250,.12); }
.bmi-status.neutral { color:var(--text2); }
.bmi-meter { height:8px; position:relative; margin-top:20px; border-radius:99px; background:linear-gradient(90deg,#60a5fa 0%,#c8ff00 37%,#ffa040 72%,#ff4d4d 100%); }
.bmi-meter-marker { position:absolute; top:50%; width:13px; height:13px; border:3px solid var(--surface); border-radius:50%; background:var(--text); transform:translate(-50%,-50%); box-shadow:0 0 0 1px var(--text); }
.bmi-scale { display:flex; justify-content:space-between; gap:5px; margin-top:8px; color:var(--text3); font-size:9px; }

.bmi-empty, .achievement-empty { display:flex; min-height:240px; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--text2); gap:9px; padding:20px; }
.bmi-empty-icon, .achievement-empty-mark { display:grid; place-items:center; width:48px; height:48px; margin-bottom:4px; border-radius:14px; background:var(--accent-dim); color:var(--accent); font:25px 'Bebas Neue',sans-serif; }

.bmi-empty span, .achievement-empty span { max-width:270px; font-size:11px; line-height:1.6; }
.achievements-panel { margin-top:14px; }
.achievements-header { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; }

.record-form { margin:5px 0 18px; padding:18px; border:1px solid var(--border); border-radius:12px; background:var(--surface2); }

/* Responsive app shell and polish */
body { width:100%; max-width:none; min-height:100vh; padding-bottom:92px; user-select:text; }
.topbar { width:100%; padding:15px max(18px, calc((100% - 1120px)/2)); align-items:center; }
.topbar > div:first-child { flex:0 0 auto; }

.nav-btn { min-height:64px; }
.nav-btn:hover { color:var(--text); }
.nav-btn.active:hover { color:var(--accent); }
.ex-card, .schedule-card, .hist-item, .stat-card, .date-hero, .rest-card { box-shadow:0 8px 22px rgba(0,0,0,.06); }
.ex-card:hover, .schedule-card:hover, .hist-item:hover { border-color:var(--text3); }
.schedule-card { height:fit-content; }
.schedule-header { padding:18px 20px; }

#view-schedule #schedule-content { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }

@media (max-width:760px) {
  .topbar { padding:13px 16px; }
  .topbar-title { font-size:27px; }
  .profile-shortcut { width:38px; height:38px; padding:0; justify-content:center; }
  .profile-shortcut span { display:none; }
  .view { padding-top:18px; }
  #view-schedule #schedule-content { grid-template-columns:1fr; }
  .nav { max-width:100%; border-radius:14px 14px 0 0; }
  .nav-btn { padding:9px 0 10px; }
}
@media (max-width:380px) {
  .nav-label { font-size:9px; letter-spacing:.02em; }
  .nav-btn svg { width:20px; height:20px; }
  .stats-row { gap:6px; }
  .stat-card { padding:10px; }
}

// ===== js/core/storage.js =====
/** Small, defensive localStorage wrapper. All app data remains on this device/browser. */
function readJSON(key, fallback = null) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (error) {
    console.warn(`[GYM LOG] Не удалось прочитать ${key}`, error);
    return fallback;
  }
}

function writeJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (error) {
    console.error(`[GYM LOG] Не удалось сохранить ${key}`, error);
    return false;
  }
}

function removeKey(key) {
  try {
    localStorage.removeItem(key);
  } catch (error) {
    console.warn(`[GYM LOG] Не удалось удалить ${key}`, error);
  }
}

/**
 * BMI is a screening indicator, not a diagnosis or a measure of body composition.
 * Weight difference is a mathematical comparison with the adult BMI range only.
 */
function calculateBodyMetrics(weightKg, heightCm, age = null) {
  const weight = Number(weightKg);
  const height = Number(heightCm);
  if (!Number.isFinite(weight) || !Number.isFinite(height) || weight <= 0 || height <= 0) return null;

  const heightM = height / 100;
  const bmi = weight / (heightM * heightM);
  const lowerWeight = 18.5 * heightM * heightM;
  const upperWeight = 24.9 * heightM * heightM;
  const ageKnown = age !== null && age !== undefined && age !== '' && Number.isFinite(Number(age)) && Number(age) > 0;
  const isUnder18 = ageKnown && Number(age) < 18;
  const needsAge = !ageKnown;

  let category = 'Стандартный диапазон';
  let message = 'Показатель находится в стандартном диапазоне ИМТ для взрослых.';
  let difference = 0;
  let differenceLabel = '';

  if (isUnder18) {
    category = 'Нужна возрастная оценка';
    message = 'Для людей младше 18 лет используют возрастные и половые перцентили. Взрослая шкала и расчёт разницы веса здесь не применяются.';
  } else if (needsAge) {
    category = 'Укажите возраст';
    message = 'ИМТ рассчитан. Для интерпретации показателя и весовых ориентиров нужно указать возраст: взрослая шкала применяется с 18 лет.';
  } else if (bmi < 18.5) {
    category = 'Ниже диапазона';
    message = 'ИМТ ниже стандартного взрослого диапазона. Не используйте этот расчёт для самостоятельной постановки цели веса.';
    difference = lowerWeight - weight;
    differenceLabel = 'Разница до нижней границы диапазона';
  } else if (bmi > 24.9 && bmi < 30) {
    category = 'Выше диапазона';
    message = 'ИМТ выше стандартного взрослого диапазона. Это скрининговый показатель, а не оценка процента жира.';
    difference = weight - upperWeight;
    differenceLabel = 'Разница до верхней границы диапазона';
  } else if (bmi >= 30) {
    category = 'Значительно выше диапазона';
    message = 'ИМТ значительно выше стандартного взрослого диапазона. Для персональной оценки лучше обсудить показатели со специалистом.';
    difference = weight - upperWeight;
    differenceLabel = 'Разница до верхней границы диапазона';
  }

  return {
    bmi,
    category,
    message,
    lowerWeight,
    upperWeight,
    difference: Math.max(0, difference),
    differenceLabel,
    isUnder18,
    needsAge
  };
}

let activeSession = null; // { workoutId, started, checked: Set<id> }
let timerInterval = null;

function loadSession() {
  activeSession = readJSON('gym_session', null);
  if (activeSession && activeSession.checked) {
    activeSession.checked = new Set(activeSession.checked);
  }
}

function saveSession() {
  if (!activeSession) { removeKey('gym_session'); return; }
  const s = { ...activeSession, checked: [...activeSession.checked] };
  writeJSON('gym_session', s);
}

function loadHistory() {
  const history = readJSON('gym_history', []);
  return Array.isArray(history) ? history : [];
}

function saveHistory(hist) {
  writeJSON('gym_history', hist);
}

function exerciseCard(ex, isDone, interactive) {
  const doneClass = isDone ? 'done' : '';
  const onclick = interactive ? `onclick="toggleExercise('${ex.id}')"` : '';
  const expandId = `detail-${ex.id}`;
  const chevId = `chev-${ex.id}`;

  const primPills = ex.primary.map(p => `<span class="muscle-tag primary">${p}</span>`).join('');
  const secPills = ex.secondary.map(p => `<span class="muscle-tag">${p}</span>`).join('');

  return `
    <div class="ex-card ${doneClass}" id="card-${ex.id}">
      <div class="ex-card-main" ${onclick}>
        ${interactive ? `
        <div class="ex-checkbox">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor"><polyline points="2,7 5.5,11 12,3"/></svg>
        </div>` : `<div style="width:22px;height:22px;flex-shrink:0;border:1.5px solid var(--border);border-radius:6px;"></div>`}
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-sets">${ex.sets}</div>
          <div class="ex-muscles">${primPills}${secPills}</div>
        </div>
        <div class="ex-expand-btn" id="${chevId}" onclick="event.stopPropagation(); toggleDetail('${expandId}','${chevId}')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6,9 12,15 18,9"/></svg>
        </div>
      </div>

  `;
}

function toggleDetail(expandId, chevId) {
  const el = document.getElementById(expandId);
  const ch = document.getElementById(chevId);
  el.classList.toggle('open');
  ch.classList.toggle('open');
}

function toggleExercise(exId) {
  if (!activeSession) return;
  if (activeSession.checked.has(exId)) {
    activeSession.checked.delete(exId);
  } else {
    activeSession.checked.add(exId);
  }
  saveSession();

  const card = document.getElementById('card-' + exId);
  const w = WORKOUT_DATA[activeSession.workoutId];
  const total = w.exercises.length;
  const done = activeSession.checked.size;
  const pct = Math.round(done / total * 100);

  if (card) {
    card.classList.toggle('done', activeSession.checked.has(exId));
    card.classList.add('just-done');
    setTimeout(() => card.classList.remove('just-done'), 300);
    const nameEl = card.querySelector('.ex-name');
    if (nameEl) nameEl.style.textDecoration = activeSession.checked.has(exId) ? 'line-through' : '';
    if (nameEl) nameEl.style.color = activeSession.checked.has(exId) ? 'var(--text2)' : '';
    const checkEl = card.querySelector('.ex-checkbox');
    if (checkEl) {
      if (activeSession.checked.has(exId)) {
        checkEl.style.background = 'var(--accent)';
        checkEl.style.borderColor = 'var(--accent)';
        checkEl.querySelector('svg').style.opacity = '1';
      } else {
        checkEl.style.background = '';
        checkEl.style.borderColor = '';
        checkEl.querySelector('svg').style.opacity = '0';
      }
    }
  }

  const fill = document.getElementById('prog-fill');
  if (fill) fill.style.width = pct + '%';
  const countEl = document.querySelector('.progress-count');
  if (countEl) countEl.textContent = `${done} / ${total}`;

  if (done === total) showToast('🎯 Все упражнения выполнены!');
}

function startSession(workoutId) {
  activeSession = {
    workoutId,
    started: Date.now(),
    checked: new Set()
  };
  saveSession();
  window.switchView('today');
}

function cancelSession() {
  if (!confirm('Отменить тренировку? Прогресс не сохранится.')) return;
  activeSession = null;
  saveSession();
  stopTimer();
  renderToday();
}

function formatTimer(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}:${String(m % 60).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
}

function startTimer() {
  stopTimer();
  timerInterval = setInterval(() => {
    if (!activeSession) return;
    const el = document.getElementById('timer-val');
    if (el) el.textContent = formatTimer(Date.now() - activeSession.started);
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

// FINISH MODAL

function openFinishModal() {
  if (!activeSession) return;
  const w = WORKOUT_DATA[activeSession.workoutId];
  const total = w.exercises.length;
  const done = activeSession.checked.size;
  const elapsed = formatTimer(Date.now() - activeSession.started);
  const pct = Math.round(done / total * 100);

  document.getElementById('finish-modal-stats').innerHTML = `
    <div class="finish-stat"><div class="finish-stat-val">${done}/${total}</div><div class="finish-stat-lbl">Упражнений</div></div>
    <div class="finish-stat"><div class="finish-stat-val">${pct}%</div><div class="finish-stat-lbl">Выполнено</div></div>
    <div class="finish-stat"><div class="finish-stat-val">${elapsed}</div><div class="finish-stat-lbl">Время</div></div>
    <div class="finish-stat"><div class="finish-stat-val">${w.type}</div><div class="finish-stat-lbl">Тренировка</div></div>
  `;
  document.getElementById('finish-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('finish-modal').classList.remove('open');
}

function confirmFinish() {
  if (!activeSession) return;
  const w = WORKOUT_DATA[activeSession.workoutId];
  const total = w.exercises.length;
  const done = activeSession.checked.size;
  const elapsed = Date.now() - activeSession.started;

  const hist = loadHistory();
  hist.unshift({
    id: Date.now(),
    workoutId: activeSession.workoutId,
    workoutType: w.type,
    workoutLabel: w.label,
    iconClass: w.iconClass,
    iconText: w.iconText,
    date: new Date().toISOString(),
    doneCount: done,
    totalCount: total,
    elapsedMs: elapsed
  });
  saveHistory(hist);

  activeSession = null;
  saveSession();
  stopTimer();
  closeModal();
  window.switchView('history');
  showToast('✅ Тренировка сохранена!');
}

// ---------- STOPWATCH ----------
let swRunning = false;
let swStartTime = 0;
let swElapsed = 0;
let swInterval_id = null;
let swLaps = [];
let swLapStart = 0;
const SW_CIRC = 766.5;

function swFmt(ms, big) {
  const totalCs = Math.floor(ms / 10);
  const cs = totalCs % 100;
  const totalS = Math.floor(ms / 1000);
  const s = totalS % 60, m = Math.floor(totalS / 60) % 60, h = Math.floor(totalS / 3600);
  const ms2 = `<span style="font-size:${big?'30':'14'}px;color:var(--text2)">.${String(cs).padStart(2,'0')}</span>`;
  if (h > 0) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}${ms2}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}${ms2}`;
}
function swFmtPlain(ms) {
  const cs = Math.floor(ms / 10) % 100;
  const totalS = Math.floor(ms / 1000);
  const s = totalS % 60, m = Math.floor(totalS / 60) % 60, h = Math.floor(totalS / 3600);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}
function swGetEl() { return swRunning ? swElapsed + (Date.now() - swStartTime) : swElapsed; }

function swTick() {
  const el = swGetEl();
  document.getElementById('sw-display').innerHTML = swFmt(el, true);
  const prog = (el % 60000) / 60000;
  document.getElementById('sw-ring').style.strokeDashoffset = SW_CIRC * (1 - prog);
  if (swLaps.length > 0) {
    const lapEl = el - swLapStart;
    document.getElementById('sw-lap-info').textContent = `Круг ${swLaps.length + 1}: ${swFmtPlain(lapEl)}`;
  }
}

function swRightAction() {
  if (!swRunning) {
    swRunning = true; swStartTime = Date.now();
    swInterval_id = setInterval(swTick, 30);
    document.getElementById('sw-right-btn').classList.add('running');
    document.getElementById('sw-right-label').textContent = 'Стоп';
    document.getElementById('sw-left-label').textContent = 'Круг';
    document.getElementById('sw-ring').classList.remove('paused');
  } else {
    swElapsed = swGetEl(); swRunning = false;
    clearInterval(swInterval_id);
    document.getElementById('sw-ring').classList.add('paused');
    document.getElementById('sw-right-btn').classList.remove('running');
    document.getElementById('sw-right-label').textContent = 'Старт';
    document.getElementById('sw-left-label').textContent = 'Сброс';
  }
}

function swLeftAction() {
  if (swRunning) {
    const el = swGetEl();
    const lapMs = el - swLapStart;
    swLaps.unshift({ lapMs, totalMs: el, num: swLaps.length + 1 });
    swLapStart = el;
    swRenderLaps();
    document.getElementById('sw-laps-wrap').style.display = 'block';
    document.getElementById('sw-lap-info').textContent = `Круг ${swLaps.length + 1}: 00:00.00`;
  } else {
    swElapsed = 0; swRunning = false; swLaps = []; swLapStart = 0;
    clearInterval(swInterval_id);
    document.getElementById('sw-display').innerHTML = `00:00<span style="font-size:30px;color:var(--text2)">.00</span>`;
    document.getElementById('sw-ring').style.strokeDashoffset = SW_CIRC;
    document.getElementById('sw-ring').classList.remove('paused');
    document.getElementById('sw-right-btn').classList.remove('running');
    document.getElementById('sw-right-label').textContent = 'Старт';
    document.getElementById('sw-left-label').textContent = 'Сброс';
    document.getElementById('sw-laps-wrap').style.display = 'none';
    document.getElementById('sw-laps-list').innerHTML = '';
    document.getElementById('sw-lap-info').textContent = '';
  }
}

function swRenderLaps() {
  if (!swLaps.length) return;
  const times = swLaps.slice(swRunning ? 1 : 0).map(l => l.lapMs);
  const fastest = times.length ? Math.min(...times) : -1;
  const slowest = times.length > 1 ? Math.max(...times) : -1;
  document.getElementById('sw-laps-list').innerHTML = swLaps.map((l, i) => {
    let cls = '';
    if (i === 0 && swRunning) cls = 'current';
    else if (l.lapMs === fastest && fastest !== -1) cls = 'fastest';
    else if (l.lapMs === slowest && slowest !== -1) cls = 'slowest';
    return `<div class="clk-lap-row ${cls}">
      <span class="clk-lap-num">Круг ${l.num}</span>
      <span class="clk-lap-time">${swFmtPlain(l.lapMs)}</span>
      <span style="font-size:13px;color:var(--text3)">${swFmtPlain(l.totalMs)}</span>
    </div>`;
  }).join('');
}

// ---------- TIMER ----------
let tmrRunning = false;
let tmrPaused = false;
let tmrTotalMs = 0;
let tmrRemaining = 0;
let tmrStartAt = 0;
let tmrInterval_id = null;
let tmrDone = false;
let pickerH = 0, pickerM = 0, pickerS = 0;
const TMR_CIRC = 766.5;

function buildPickerCol(id, maxVal, initial) {
  const col = document.getElementById('tmr-col-' + id);
  if (!col) return;
  col.innerHTML = '';
  for (let i = 0; i <= maxVal; i++) {
    const div = document.createElement('div');
    div.className = 'tmr-col-item';
    div.textContent = String(i).padStart(2, '0');
    col.appendChild(div);
  }
  requestAnimationFrame(() => { col.scrollTop = initial * 44; });
}

function onPickerScroll(id) {
  const col = document.getElementById('tmr-col-' + id);
  clearTimeout(col._snap);
  col._snap = setTimeout(() => {
    const idx = Math.round(col.scrollTop / 44);
    col.scrollTop = idx * 44;
    if (id === 'h') pickerH = idx;
    else if (id === 'm') pickerM = idx;
    else pickerS = idx;
    updateTmrBtn();
  }, 80);
}

function updateTmrBtn() {
  const total = pickerH * 3600 + pickerM * 60 + pickerS;
  const btn = document.getElementById('tmr-right-btn');
  if (btn) { btn.style.opacity = total > 0 ? '1' : '0.4'; btn.disabled = total === 0; }
}

// ─── TIMER FORMAT FIX ───────────────────────────────────────────
// Bug was: Math.ceil(totalMs/1000) overflows into the next minute
// e.g. Math.ceil(59500/1000)=60 → decomposed as 1min 0sec (wrong!)
// Fix: floor hours & minutes independently, ceil only remaining seconds
// within the current minute, capped at 59 to prevent overflow.
function tmrFmt(ms) {
  if (ms <= 0) return '00:00';
  const pad = n => String(n).padStart(2, '0');
  const h = Math.floor(ms / 3600000);
  const remH = ms % 3600000;
  const m = Math.floor(remH / 60000);
  const remM = remH % 60000;
  // ceil seconds within this minute, but cap at 59 so we never roll over
  const s = Math.min(59, Math.ceil(remM / 1000));
  if (h > 0) return pad(h) + ':' + pad(m) + ':' + pad(s);
  return pad(m) + ':' + pad(s);
}

function tmrRightAction() {
  if (tmrDone) { tmrReset(); return; }
  if (!tmrRunning && !tmrPaused) {
    tmrTotalMs = (pickerH * 3600 + pickerM * 60 + pickerS) * 1000;
    if (!tmrTotalMs) return;
    tmrRemaining = tmrTotalMs; tmrStartAt = Date.now();
    tmrRunning = true; tmrPaused = false;
    showTmrCd();
    clearInterval(tmrInterval_id);
    tmrInterval_id = setInterval(tmrTick, 100);
    document.getElementById('tmr-right-label').textContent = 'Пауза';
    document.getElementById('tmr-right-btn').classList.add('running');
    document.getElementById('tmr-left-label').textContent = 'Отмена';
  } else if (tmrRunning) {
    tmrRemaining = Math.max(0, tmrRemaining - (Date.now() - tmrStartAt));
    tmrRunning = false; tmrPaused = true;
    clearInterval(tmrInterval_id);
    document.getElementById('tmr-ring').classList.add('paused');
    document.getElementById('tmr-right-btn').classList.remove('running');
    document.getElementById('tmr-right-label').textContent = 'Продолжить';
  } else if (tmrPaused) {
    tmrStartAt = Date.now(); tmrRunning = true; tmrPaused = false;
    clearInterval(tmrInterval_id);
    tmrInterval_id = setInterval(tmrTick, 100);
    document.getElementById('tmr-ring').classList.remove('paused');
    document.getElementById('tmr-right-btn').classList.add('running');
    document.getElementById('tmr-right-label').textContent = 'Пауза';
  }
}

function tmrLeftAction() { tmrReset(); }

function tmrTick() {
  const elapsed = Date.now() - tmrStartAt;
  const rem = Math.max(0, tmrRemaining - elapsed);
  const disp = document.getElementById('tmr-display');
  if (disp) disp.textContent = tmrFmt(rem);
  const ring = document.getElementById('tmr-ring');
  if (ring) ring.style.strokeDashoffset = TMR_CIRC * (1 - rem / tmrTotalMs);
  if (rem <= 0) {
    clearInterval(tmrInterval_id);
    tmrRunning = false; tmrDone = true;
    if (disp) { disp.textContent = '00:00'; disp.classList.add('alerting'); }
    if (ring) { ring.style.strokeDashoffset = TMR_CIRC; ring.classList.add('alert'); }
    const done = document.getElementById('tmr-done');
    if (done) done.classList.add('show');
    document.getElementById('tmr-right-label').textContent = 'Готово';
    document.getElementById('tmr-right-btn').classList.remove('running');
    if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
    window.showToast('⏰ Время вышло!');
  }
}

function showTmrCd() {
  document.getElementById('tmr-picker-section').style.display = 'none';
  document.getElementById('tmr-countdown-section').style.display = '';
  document.getElementById('tmr-display').textContent = tmrFmt(tmrRemaining);
  const ring = document.getElementById('tmr-ring');
  ring.classList.remove('paused','alert');
  ring.style.strokeDashoffset = '0';
}

function tmrReset() {
  clearInterval(tmrInterval_id);
  tmrRunning = false; tmrPaused = false; tmrDone = false;
  tmrRemaining = 0; tmrTotalMs = 0;
  document.getElementById('tmr-picker-section').style.display = '';
  document.getElementById('tmr-countdown-section').style.display = 'none';
  const done = document.getElementById('tmr-done');
  if (done) done.classList.remove('show');
  const disp = document.getElementById('tmr-display');
  if (disp) disp.classList.remove('alerting');
  const ring = document.getElementById('tmr-ring');
  if (ring) { ring.classList.remove('paused','alert'); ring.style.strokeDashoffset = '0'; }
  document.getElementById('tmr-right-btn').classList.remove('running');
  document.getElementById('tmr-right-label').textContent = 'Старт';
  document.getElementById('tmr-left-label').textContent = 'Отмена';
  document.getElementById('tmr-right-btn').style.cssText = '';
  updateTmrBtn();
}

// Init pickers after DOM is ready
setTimeout(() => {
  buildPickerCol('h', 23, pickerH);
  buildPickerCol('m', 59, pickerM);
  buildPickerCol('s', 59, pickerS);
  updateTmrBtn();
}, 300);

  switchClockTab, swRightAction, swLeftAction, tmrRightAction, tmrLeftAction, onPickerScroll
});

/** Theme preference keeps the original plain-string storage format for compatibility. */
function applyTheme(theme) {
  const html = document.documentElement;
  const moon = document.getElementById('icon-moon');
  const sun = document.getElementById('icon-sun');
  if (theme === 'light') {
    html.setAttribute('data-theme', 'light');
    if (moon) moon.style.display = 'none';
    if (sun) sun.style.display = '';
  } else {
    html.removeAttribute('data-theme');
    if (moon) moon.style.display = '';
    if (sun) sun.style.display = 'none';
  }
}

function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  applyTheme(next);
  try { localStorage.setItem('gym_theme', next); } catch (error) { console.warn('[GYM LOG] Не удалось сохранить тему', error); }
}

function initTheme() {
  let saved = 'dark';
  try {
    // Supports both the original plain strings and a JSON-encoded value.
    const raw = localStorage.getItem('gym_theme');
    if (raw === 'light' || raw === 'dark') saved = raw;
    else if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed === 'light' || parsed === 'dark') saved = parsed;
    }
  } catch (error) {
    console.warn('[GYM LOG] Не удалось прочитать тему', error);
  }
  applyTheme(saved);
}

  if (values.age !== null && (!Number.isInteger(values.age) || values.age < 1 || values.age > 100)) {
    showMessage('Возраст должен быть от 1 до 100 лет');
    return;
  }
  if (values.targetWeightKg !== null && (values.targetWeightKg < 20 || values.targetWeightKg > 350)) {
    showMessage('Целевой вес должен быть от 20 до 350 кг');
    return;
  }

  const saved = writeJSON(PROFILE_KEY, { ...values, name, updatedAt: new Date().toISOString() });
  if (saved) {
    renderProfile();
    showMessage('Параметры профиля сохранены');
  } else {
    showMessage('Не удалось сохранить данные браузера');
  }
}

function saveRecord(event) {
  event.preventDefault();
  const data = new FormData(event.target);
  const exercise = String(data.get('exercise') || '').trim();
  const weight = number(data.get('weight'));
  const repsRaw = String(data.get('reps') || '').trim();
  const reps = repsRaw ? Number.parseInt(repsRaw, 10) : null;
  const date = String(data.get('date') || '');
  const note = String(data.get('note') || '').trim();

  if (!exercise || exercise.length > 90) return showMessage('Укажите упражнение или тренажёр');
  if (!Number.isFinite(weight) || weight <= 0 || weight > 1000) return showMessage('Укажите корректный вес от 0,1 до 1000 кг');
  if (reps !== null && (!Number.isInteger(reps) || reps < 1 || reps > 1000)) return showMessage('Количество повторений должно быть от 1 до 1000');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return showMessage('Укажите дату достижения');

  const records = loadRecords();
  const existing = editingRecordId ? records.find(item => item.id === editingRecordId) : null;
  const key = exercise.toLocaleLowerCase('ru');
  const previousBest = records
    .filter(item => item.id !== editingRecordId && String(item.exercise).trim().toLocaleLowerCase('ru') === key)
    .reduce((max, item) => Math.max(max, Number(item.weight) || 0), 0);
  const record = {
    id: existing?.id || (globalThis.crypto?.randomUUID?.() || `record-${Date.now()}`),
    exercise,
    weight,
    reps,
    date,
    note,
    createdAt: existing?.createdAt || new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  const next = existing ? records.map(item => item.id === editingRecordId ? record : item) : [...records, record];
  if (writeJSON(RECORDS_KEY, next)) {
    editingRecordId = null;
    isRecordFormOpen = false;
    renderProfile();
    showMessage(weight > previousBest ? 'Новый личный рекорд сохранён!' : 'Достижение сохранено');
  } else {
    showMessage('Не удалось сохранить достижение');
  }
}

function handleClick(event) {
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const action = button.dataset.action;
  const id = button.dataset.id;

  if (action === 'add-record') {
    editingRecordId = null;
    isRecordFormOpen = true;
    renderProfile();
    root.querySelector('#record-exercise')?.focus();
  } else if (action === 'cancel-record') {
    editingRecordId = null;
    isRecordFormOpen = false;
    renderProfile();
  } else if (action === 'edit-record') {
    editingRecordId = id;
    isRecordFormOpen = true;
    renderProfile();
    root.querySelector('#record-exercise')?.focus();
  } else if (action === 'delete-record') {
    const record = loadRecords().find(item => item.id === id);
    if (!record || !window.confirm(`Удалить достижение «${record.exercise}»?`)) return;
    const next = loadRecords().filter(item => item.id !== id);
    if (writeJSON(RECORDS_KEY, next)) {
      renderProfile();
      showMessage('Достижение удалено');
    }
  }
}

function initProfile() {
  root = document.getElementById('profile-content');
  if (!root || root.dataset.initialized === 'true') return;
  root.dataset.initialized = 'true';
  root.addEventListener('submit', event => {
    if (event.target.id === 'profile-form') saveProfile(event);
    if (event.target.id === 'achievement-form') saveRecord(event);
  });
  root.addEventListener('click', handleClick);
  root.addEventListener('input', event => {
    if (['profile-weight', 'profile-height', 'profile-age', 'profile-goal'].includes(event.target.id)) updateBmiPreview();
  });
  renderProfile();
}

const VIEWS = new Set(['today', 'schedule', 'history', 'timer', 'profile']);
let currentView = 'today';

function switchView(view) {
  if (!VIEWS.has(view)) return;
  currentView = view;

  document.querySelectorAll('.view').forEach(element => {
    const active = element.id === `view-${view}`;
    element.classList.toggle('active', active);
    element.style.display = active ? (view === 'timer' ? 'flex' : 'block') : 'none';
  });

  document.querySelectorAll('.nav-btn').forEach(element => {
    const active = element.id === `nav-${view}`;
    element.classList.toggle('active', active);
    element.setAttribute('aria-current', active ? 'page' : 'false');
  });

  if (view === 'today') renderToday();
  if (view === 'schedule') renderSchedule();
  if (view === 'history') renderHistory();
  if (view === 'profile') renderProfile();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Bridge only the functions used by the existing inline controls.
Object.assign(window, { switchView, toggleTheme, showToast });

function updateHeaderDate() {
  const now = new Date();
  const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  const node = document.getElementById('topbar-date');
  if (node) node.innerHTML = `<div>${now.getDate()} ${months[now.getMonth()]}</div><div>${days[now.getDay()]}</div>`;
}

function initApp() {
  initTheme();
  loadSession();
  initProfile();
  updateHeaderDate();
  renderToday();
  if (document.getElementById('view-today')) {
    document.getElementById('view-today').style.display = 'block';
    document.getElementById('view-profile').style.display = 'none';
  }
  if (currentView === 'today') {
    document.getElementById('nav-today')?.setAttribute('aria-current', 'page');
  }
}

initApp();
