<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="GYM LOG — дневник тренировок, история занятий, таймер и личные рекорды.">
  <title>GYM LOG — личный дневник тренировок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,0,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/profile.css">
  <link rel="stylesheet" href="./css/training-log.css">
  <link rel="stylesheet" href="./css/progress.css">
  <link rel="stylesheet" href="./css/catalog.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="topbar-sub">Твой личный дневник</div>
      <div class="topbar-title">GYM LOG</div>
    </div>
    <div class="topbar-actions">
      <div id="topbar-date" style="text-align:right;font-size:12px;color:var(--text2);line-height:1.5"></div>
      <button class="profile-shortcut" type="button" onclick="switchView('profile')" title="Открыть профиль" aria-label="Открыть профиль">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.7-3.6 3.2-5.5 7.5-5.5s6.8 1.9 7.5 5.5"/></svg>
        <span>Профиль</span>
      </button>
      <button class="theme-toggle" id="theme-toggle" type="button" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему">
        <svg id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <main class="app-main">
    <section class="view active" id="view-today" aria-label="Сегодня">
      <div id="today-content"></div>
    </section>

    <section class="view" id="view-schedule" aria-label="Расписание">
      <div id="schedule-content"></div>
    </section>

    <section class="view" id="view-history" aria-label="История тренировок">
      <div id="history-content"></div>
    </section>

    <section class="view" id="view-catalog" aria-label="Каталог упражнений">
      <div id="catalog-content"></div>
    </section>

    <section class="view" id="view-timer" aria-label="Таймер и секундомер">
      <div class="clk-tabs">
        <button class="clk-tab active" id="tab-stopwatch" type="button" onclick="switchClockTab('stopwatch')">Секундомер</button>
        <button class="clk-tab" id="tab-timer" type="button" onclick="switchClockTab('timer')">Таймер</button>
      </div>

      <div class="clk-panel active" id="panel-stopwatch">
        <div class="clk-ring-wrap">
          <svg class="clk-ring-svg" viewBox="0 0 260 260"><circle class="clk-ring-bg" cx="130" cy="130" r="122"/><circle class="clk-ring-fg" id="sw-ring" cx="130" cy="130" r="122" stroke-dasharray="766.5" stroke-dashoffset="766.5"/></svg>
          <div class="clk-display"><div class="clk-time" id="sw-display">00:00<span style="font-size:30px;color:var(--text2)">.00</span></div><div class="clk-lap-count" id="sw-lap-info"></div></div>
        </div>
        <div class="clk-btns">
          <button class="clk-btn clk-btn-gray" id="sw-left-btn" type="button" onclick="swLeftAction()"><span id="sw-left-label">Сброс</span></button>
          <button class="clk-btn clk-btn-green" id="sw-right-btn" type="button" onclick="swRightAction()"><span id="sw-right-label">Старт</span></button>
        </div>
        <div class="clk-laps" id="sw-laps-wrap" style="display:none"><div class="clk-lap-header"><span>Круг</span><span>Время круга</span><span>Всего</span></div><div id="sw-laps-list"></div></div>
      </div>

      <div class="clk-panel" id="panel-timer">
        <div class="tmr-done-banner" id="tmr-done">ВРЕМЯ ВЫШЛО!</div>
        <div id="tmr-picker-section">
          <div class="tmr-picker-wrap" id="tmr-picker-wrap">
            <div class="tmr-picker-highlight"></div>
            <div class="tmr-col" id="tmr-col-h" onscroll="onPickerScroll('h')"></div><div class="tmr-col-label">ч</div>
            <div class="tmr-col" id="tmr-col-m" onscroll="onPickerScroll('m')"></div><div class="tmr-col-label">мин</div>
            <div class="tmr-col" id="tmr-col-s" onscroll="onPickerScroll('s')"></div><div class="tmr-col-label">сек</div>
          </div>
        </div>
        <div class="tmr-countdown-wrap" id="tmr-countdown-section" style="display:none">
          <div class="clk-ring-wrap">
            <svg class="clk-ring-svg" viewBox="0 0 260 260"><circle class="clk-ring-bg" cx="130" cy="130" r="122"/><circle class="clk-ring-fg" id="tmr-ring" cx="130" cy="130" r="122" stroke-dasharray="766.5" stroke-dashoffset="0"/></svg>
            <div class="clk-display"><div class="tmr-countdown" id="tmr-display">00:00</div><div class="tmr-subtitle" id="tmr-subtitle"></div></div>
          </div>
        </div>
        <div class="clk-btns">
          <button class="clk-btn clk-btn-gray" id="tmr-left-btn" type="button" onclick="tmrLeftAction()"><span id="tmr-left-label">Отмена</span></button>
          <button class="clk-btn clk-btn-green" id="tmr-right-btn" type="button" onclick="tmrRightAction()"><span id="tmr-right-label">Старт</span></button>
        </div>
      </div>
    </section>

    <section class="view" id="view-profile" aria-label="Профиль">
      <div id="profile-content"></div>
    </section>
  </main>

  <nav class="nav" aria-label="Основная навигация">
    <button class="nav-btn active" type="button" onclick="switchView('today')" id="nav-today" aria-label="Сегодня">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12L12 3L21 12V20C21 20.5523 20.5523 21 20 21H15V16H9V21H4C3.44772 21 3 20.5523 3 20V12Z" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-label">Сегодня</span>
    </button>
    <button class="nav-btn" type="button" onclick="switchView('schedule')" id="nav-schedule" aria-label="Расписание">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 2V6M8 2V6M3 10H21" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-label">Расписание</span>
    </button>
    <button class="nav-btn" type="button" onclick="switchView('history')" id="nav-history" aria-label="История">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7V12L15 15"/></svg><span class="nav-label">История</span>
    </button>
    <button class="nav-btn" type="button" onclick="switchView('catalog')" id="nav-catalog" aria-label="Каталог упражнений">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 1 4 17.5z" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17.5A2.5 2.5 0 0 1 6.5 15H20M8 6h8M8 9h8" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-label">Каталог</span>
    </button>
    <button class="nav-btn" type="button" onclick="switchView('timer')" id="nav-timer" aria-label="Таймер">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="13" r="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9v4l2.5 2.5M9.5 2.5h5M12 2.5V5" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="nav-label">Таймер</span>
    </button>
    <button class="nav-btn" type="button" onclick="switchView('profile')" id="nav-profile" aria-label="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.7-3.6 3.2-5.5 7.5-5.5s6.8 1.9 7.5 5.5" stroke-linecap="round"/></svg><span class="nav-label">Профиль</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-overlay" id="finish-modal" role="dialog" aria-modal="true" aria-labelledby="finish-modal-title">
    <div class="modal"><div class="modal-title" id="finish-modal-title">Завершить тренировку?</div><div id="finish-modal-stats" class="finish-stats"></div><button class="btn btn-accent" type="button" onclick="confirmFinish()">Сохранить в историю</button><button class="btn btn-outline" type="button" onclick="closeModal()" style="margin-top:8px">Продолжить</button></div>
  </div>

  <div class="modal-overlay" id="clear-modal" role="dialog" aria-modal="true" aria-labelledby="clear-modal-title">
    <div class="modal"><div class="modal-title" id="clear-modal-title">Очистить историю?</div><div class="modal-text">Все записи о прошлых тренировках будут удалены. Это действие нельзя отменить.</div><button class="btn btn-danger" type="button" onclick="confirmClear()">Да, удалить всё</button><button class="btn btn-outline" type="button" onclick="document.getElementById('clear-modal').classList.remove('open')" style="margin-top:8px">Отмена</button></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
